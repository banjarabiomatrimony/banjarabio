<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BanjaraBio Matrimony Profile - View & Connect with your community">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BanjaraBio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BanjaraBio Matrimony</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 100%;
    }
    .logo {
      font-size: 40px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #fbbf24;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #e11d48;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #be123c;
    }
  </style>

  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var playStoreUrl = "https://play.google.com/store/apps/details?id=com.avishio.banjarabio";
      
      // Parse profile ID if present in path e.g. /profile/123
      var profileId = null;
      if (path.indexOf('/profile/') !== -1) {
        profileId = path.split('/profile/')[1];
      } else {
        var params = new URLSearchParams(search);
        profileId = params.get('profile') || params.get('id');
      }

      if (profileId) {
        playStoreUrl += "&referrer=profile_" + encodeURIComponent(profileId);
        
        // Try custom scheme launch first for mobile browsers
        var customScheme = "banjarabio://profile/" + profileId;
        var start = Date.now();
        window.location.href = customScheme;

        // If app doesn't open within 1.5 seconds, redirect to Play Store
        setTimeout(function() {
          if (Date.now() - start < 2000) {
            window.location.href = playStoreUrl;
          }
        }, 1500);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">🌾</div>
    <h1>BanjaraBio Matrimony</h1>
    <p>Opening BanjaraBio app... If you are not redirected automatically, tap the button below to view the profile in Google Play Store.</p>
    <a id="playstore-btn" href="https://play.google.com/store/apps/details?id=com.avishio.banjarabio" class="btn">Open in Play Store</a>
  </div>
</body>
</html>
