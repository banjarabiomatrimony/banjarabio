name: banjarabio
description: A new Flutter project.
publish_to: none
version: 1.3.3+41

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core UI and responsive design
  sizer: ^3.1.3
  flutter_svg: ^2.2.3
  google_fonts: ^7.1.0
  font_awesome_flutter: ^10.8.0
  shared_preferences: ^2.5.4
  equatable: ^2.0.7
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  sentry_flutter: ^8.13.0
  firebase_performance: ^0.10.0+24

  # Feature dependencies
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  file: ^7.0.0
  connectivity_plus: ^7.0.0
  fluttertoast: ^8.2.4
  intl: ^0.20.2
  flutter_slidable: ^4.0.3
  camera: ^0.11.3
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  image_cropper: ^11.0.0
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.5.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  share_plus: ^10.1.2
  razorpay_flutter: ^1.4.1
  crypto: ^3.0.3
  app_links: ^6.4.1
  image: ^4.1.4 # For image compression
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.0 # For temporary directory access
  path: ^1.8.0
  shimmer: ^3.0.0
  pdf: ^3.10.7
  printing: ^5.11.1
  # TODO: Future Usage - Exact location not required for now
  # geolocator: ^13.0.1
  # geocoding: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0
  firebase_app_check: ^0.3.2+10

  meta: any
  vector_math: ^2.2.0
  http: ^1.6.0
  tutorial_coach_mark: ^1.3.3
  flutter_tts: ^4.2.5
  lottie: ^3.3.2
  google_mobile_ads: ^7.0.0
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  google_sign_in: ^6.2.2
dev_dependencies:
  flutter_test: # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE
  flutter_launcher_icons: ^0.14.4 # For generating app launcher icons
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2
  url_launcher_platform_interface: any
  plugin_platform_interface: ^2.1.8
  fake_async: ^1.3.1
  custom_lint: ^0.6.4
  golden_toolkit: ^0.15.0
  patrol: ^3.11.0

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/BanjaraBio.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/BanjaraBio.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  macos:
    generate: false
  web:
    generate: true
    image_path: "assets/logo/BanjaraBio.png"
    background_color: "#FFFFFF"
    theme_color: "#C94B4B"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
    - assets/logo/brand_kit/
    - assets/icons/
    - assets/images/
    - assets/images/biodata_templates/
    - assets/images/social/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit/Outfit-ExtraLight.ttf
